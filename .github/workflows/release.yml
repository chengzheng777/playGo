name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: 校验
        run: pnpm verify

      - name: 打 Windows 便携包
        run: pnpm package:win

      - name: 打桌面安装包（Electron + NSIS）
        run: pnpm package:app
        env:
          # 仓库 Variables 里配置；不配则不启用自动更新
          PLAYGO_UPDATE_URL: ${{ vars.PLAYGO_UPDATE_URL }}
          # 仓库 Secrets 里配置 .pfx；不配则跳过签名
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: playGo-win-x64
          path: |
            release/*.zip
            release/app/*-setup-*.exe
            release/app/latest.yml
            release/app/*.blockmap
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.zip
            release/app/*-setup-*.exe
            release/app/latest.yml
            release/app/*.blockmap
          generate_release_notes: true
