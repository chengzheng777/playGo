name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title=$TITLE"
          # 允许 Dependabot 的多个 scope：chore(deps)(deps-dev): ...
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))*!?: .+'

      - name: Check branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "branch=$BRANCH"
          echo "$BRANCH" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9][a-z0-9._-]*$'
