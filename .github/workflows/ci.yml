name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查 / Lint / 规则测试 / 构建
        run: pnpm verify

      - name: 协议冒烟
        run: |
          pnpm dev > /tmp/playgo.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:8787/api/health && break
            sleep 1
          done
          pnpm smoke
