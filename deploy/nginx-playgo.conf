# 宝塔面板 + 已有 Nginx 的反代配置示例。
# 把 play.ssrmock.com 换成你的域名，放到宝塔「网站 → 设置 → 配置文件」里，
# 或保存为 /www/server/panel/vhost/nginx/你的域名.conf 后 nginx -t && nginx -s reload。
server {
    listen 80;
    server_name play.ssrmock.com;

    # Let's Encrypt / 宝塔 SSL 的 HTTP 验证目录，不能被反代掉
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/play.ssrmock.com;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/play.ssrmock.com.log;
    error_log /www/wwwlogs/play.ssrmock.com.error.log;
}
